<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gravity Omega</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #030303;
      --black-2: #090806;
      --gold: #f2c45a;
      --gold-soft: #b9892b;
      --gold-dim: rgba(242, 196, 90, 0.14);
      --text: #f4ead0;
      --muted: #bca977;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(242, 196, 90, 0.12), transparent 28rem),
        radial-gradient(circle at 50% 50%, rgba(185, 137, 43, 0.1), transparent 42rem),
        linear-gradient(135deg, #000 0%, var(--black-2) 54%, #020100 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
    }

    body::before {
      background:
        linear-gradient(rgba(242, 196, 90, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 196, 90, 0.07) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
      opacity: 0.38;
    }

    body::after {
      background:
        repeating-linear-gradient(0deg, rgba(255, 215, 120, 0.06) 0 1px, transparent 1px 5px),
        linear-gradient(110deg, transparent 0%, transparent 41%, rgba(255, 216, 120, 0.16) 48%, transparent 56%, transparent 100%);
      background-size: auto, 260% 100%;
      mix-blend-mode: screen;
      opacity: 0.4;
      animation: sweep 7s ease-in-out infinite;
    }

    .surface {
      position: relative;
      width: min(92vw, 980px);
      min-height: min(78vh, 720px);
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 5rem);
      text-align: center;
      isolation: isolate;
    }

    .surface::before,
    .surface::after {
      position: absolute;
      inset: clamp(1rem, 3vw, 2.5rem);
      border: 1px solid rgba(242, 196, 90, 0.2);
      pointer-events: none;
      content: "";
    }

    .surface::before {
      box-shadow:
        0 0 40px rgba(242, 196, 90, 0.09),
        inset 0 0 48px rgba(242, 196, 90, 0.05);
    }

    .surface::after {
      inset: clamp(1.7rem, 4vw, 4rem);
      border-color: rgba(242, 196, 90, 0.08);
      transform: rotate(2deg);
    }

    .mark {
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: -1;
      transform: translate(-50%, -54%);
      color: rgba(242, 196, 90, 0.08);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17rem, 39vw, 34rem);
      line-height: 0.82;
      text-shadow:
        0 0 28px rgba(242, 196, 90, 0.34),
        0 0 95px rgba(242, 196, 90, 0.16);
      user-select: none;
    }

    .content {
      display: grid;
      justify-items: center;
      gap: clamp(1rem, 2.4vw, 1.7rem);
    }

    .omega {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(7.5rem, 22vw, 17rem);
      line-height: 0.78;
      color: var(--gold);
      letter-spacing: 0;
      text-shadow:
        0 0 12px rgba(255, 220, 132, 0.72),
        0 0 42px rgba(242, 196, 90, 0.38),
        0 0 120px rgba(185, 137, 43, 0.32);
      filter: drop-shadow(0 22px 44px rgba(0, 0, 0, 0.55));
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(2.65rem, 8vw, 6.2rem);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 0.95;
      text-shadow: 0 0 26px rgba(242, 196, 90, 0.22);
    }

    .rule {
      width: min(24rem, 64vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 20px rgba(242, 196, 90, 0.5);
    }

    .signal {
      margin: 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: clamp(0.82rem, 2vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      line-height: 1.8;
      text-transform: uppercase;
    }

    .rings {
      position: fixed;
      inset: 50% auto auto 50%;
      width: min(76vw, 54rem);
      aspect-ratio: 1;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow:
        inset 0 0 44px rgba(242, 196, 90, 0.05),
        0 0 90px rgba(242, 196, 90, 0.05);
    }

    .rings::before,
    .rings::after {
      position: absolute;
      inset: 10%;
      border: 1px solid rgba(242, 196, 90, 0.08);
      border-radius: inherit;
      content: "";
    }

    .rings::after {
      inset: 22%;
      border-color: rgba(242, 196, 90, 0.12);
    }

    @keyframes sweep {
      0%,
      100% {
        background-position: 0 0, 140% 0;
      }

      50% {
        background-position: 0 0, 0% 0;
      }
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
      }

      .surface {
        width: 100%;
        min-height: 100svh;
        padding: 3.5rem 1.25rem;
      }

      .surface::before {
        inset: 0.9rem;
      }

      .surface::after {
        inset: 1.5rem;
      }

      .signal {
        max-width: 18rem;
        letter-spacing: 0.16em;
      }

      .rings {
        width: 92vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="rings" aria-hidden="true"></div>
  <main class="surface" aria-labelledby="gravity-omega-title">
    <div class="mark" aria-hidden="true">&Omega;</div>
    <section class="content">
      <div class="omega" aria-hidden="true">&Omega;</div>
      <h1 id="gravity-omega-title">Gravity Omega</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="signal">Native workbench landing surface</p>
    </section>
  </main>
</body>
</html>
