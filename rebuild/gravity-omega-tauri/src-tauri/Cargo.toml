[package]
name = "gravity-omega-native"
version = "0.1.0"
description = "Linux-native Rust/Tauri replacement workbench for Gravity Omega"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
